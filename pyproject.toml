[project]
name = "recipe-hub-api"
version = "0.1.0"
description = "Recipe Hub API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.146,<0.147",
    "uvicorn[standard]>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.14,<3",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
